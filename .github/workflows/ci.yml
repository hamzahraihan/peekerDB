name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.26", "1.27"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      # gofmt writes LF, so the format check only makes sense on a LF
      # checkout.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -w .
            git diff --stat
            exit 1
          fi
      # Every target the release ships must compile. The matrix runners
      # only cover the platform they run on, so a file behind a
      # //go:build tag for another platform is never compiled here —
      # and a release would fail on it.
      - name: Cross-compile every release target
        if: runner.os == 'Linux'
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              GOOS=$os GOARCH=$arch go build ./...
            done
          done
      - run: go vet ./...
      - run: go test ./...
